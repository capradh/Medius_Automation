[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation"
version = "0.1.0"
description = "Oracle, file, API and email automation toolkit"
requires-python = ">=3.10"
dependencies = ["oracledb", "python-dotenv", "pandas", "numpy", "openpyxl", "xlrd", "requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
